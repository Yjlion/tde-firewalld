<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b9be6"/>
      <stop offset="1" stop-color="#1d4f91"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2774a"/>
      <stop offset="1" stop-color="#a8401c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M64 10 L108 24 V60 C108 88 90 106 64 118 C38 106 20 88 20 60 V24 Z"/>
    </clipPath>
  </defs>
  <!-- shield -->
  <path d="M64 6 L112 21 V60 C112 91 92 110 64 123 C36 110 16 91 16 60 V21 Z"
        fill="#163a6b"/>
  <path d="M64 10 L108 24 V60 C108 88 90 106 64 118 C38 106 20 88 20 60 V24 Z"
        fill="url(#shield)"/>
  <!-- brick wall across the lower part of the shield -->
  <g clip-path="url(#shieldClip)">
    <rect x="14" y="62" width="100" height="60" fill="#6d2a12"/>
    <g fill="url(#brick)">
      <rect x="16" y="64" width="22" height="11" rx="1"/>
      <rect x="40" y="64" width="22" height="11" rx="1"/>
      <rect x="64" y="64" width="22" height="11" rx="1"/>
      <rect x="88" y="64" width="22" height="11" rx="1"/>
      <rect x="4"  y="77" width="22" height="11" rx="1"/>
      <rect x="28" y="77" width="22" height="11" rx="1"/>
      <rect x="52" y="77" width="22" height="11" rx="1"/>
      <rect x="76" y="77" width="22" height="11" rx="1"/>
      <rect x="100" y="77" width="22" height="11" rx="1"/>
      <rect x="16" y="90" width="22" height="11" rx="1"/>
      <rect x="40" y="90" width="22" height="11" rx="1"/>
      <rect x="64" y="90" width="22" height="11" rx="1"/>
      <rect x="88" y="90" width="22" height="11" rx="1"/>
      <rect x="4"  y="103" width="22" height="11" rx="1"/>
      <rect x="28" y="103" width="22" height="11" rx="1"/>
      <rect x="52" y="103" width="22" height="11" rx="1"/>
      <rect x="76" y="103" width="22" height="11" rx="1"/>
      <rect x="100" y="103" width="22" height="11" rx="1"/>
    </g>
  </g>
  <!-- check mark -->
  <path d="M42 40 L58 54 L88 26" fill="none" stroke="#ffffff" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- gloss -->
  <path d="M64 10 L108 24 V44 C90 50 40 50 20 44 V24 Z" fill="url(#gloss)"/>
</svg>
